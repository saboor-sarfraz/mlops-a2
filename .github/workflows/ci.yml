name: VisionGuard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install runtime and lint dependencies
        run: python -m pip install -r requirements-docker.txt ruff==0.17.4
      - name: Lint
        run: ruff check webapp.py inference.py wsgi.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build VisionGuard image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: visionguard:ci
